<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Manager — Accesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-init.js"></script>
<style>
  :root {
    --bg1: #0f0f0f;
    --bg2: #1a1a1a;
    --bg3: #242424;
    --border-idle: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.14);
    --text-primary: #f0f0f0;
    --text-secondary: #888;
    --text-hint: #555;
    --accent-red: #ff3b3b;
    --accent-green: #2ecc71;
    --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg1);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: var(--bg2);
    border: 1px solid var(--border-idle);
    border-radius: 20px;
    padding: 40px 36px;
    width: 340px;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
  .login-logo {
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    text-align: center;
  }
  .login-logo span { color: var(--accent-red); }
  .login-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
    margin-top: -12px;
  }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border-idle);
    background: var(--bg3);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    cursor: pointer;
    transition: all var(--transition);
    width: 100%;
  }
  .btn-google:hover { border-color: var(--border-hover); background: #2c2c2c; }
  .btn-google:disabled { opacity: 0.6; cursor: wait; }
  .login-error {
    font-size: 13px;
    color: var(--accent-red);
    background: rgba(255,59,59,0.08);
    border: 1px solid rgba(255,59,59,0.22);
    border-radius: 10px;
    padding: 10px 14px;
    text-align: center;
    display: none;
  }
  .login-error.visible { display: block; }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo"><span>■</span> Budget Manager</div>
  <div class="login-subtitle">Accedi con il tuo account Google</div>
  <div class="login-error" id="loginError"></div>
  <button class="btn-google" id="btnGoogle">
    <svg width="18" height="18" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    Accedi con Google
  </button>
</div>
<script>
  const btn = document.getElementById('btnGoogle');
  const errEl = document.getElementById('loginError');

  function showError(msg) {
    errEl.textContent = msg;
    errEl.classList.add('visible');
  }

  // Già autenticato con account autorizzato → vai all'app
  bmAuthReady.then(user => {
    if (bmIsAllowed(user)) window.location.replace('app.html');
    else if (user) {
      showError(`Account non autorizzato: ${user.email}`);
      firebase.auth().signOut();
    }
  });

  btn.addEventListener('click', async () => {
    errEl.classList.remove('visible');
    btn.disabled = true;
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const { user } = await firebase.auth().signInWithPopup(provider);
      if (bmIsAllowed(user)) {
        window.location.replace('app.html');
      } else {
        showError(`Account non autorizzato: ${user.email}`);
        await firebase.auth().signOut();
      }
    } catch (e) {
      if (e.code !== 'auth/popup-closed-by-user') showError('Errore di accesso. Riprova.');
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
